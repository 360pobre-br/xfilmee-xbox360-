
nan:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Baixar XSDK
        run: |
          git clone --depth 1 \
            https://github.com/xenosworks/xsdk.git xsdk

      - name: Compilar ferramentas Xbox
        run: |
          cd xsdk
          PREFIX=$HOME/xsdk-gcc \
          WORK=$HOME/xsdk-gcc-work \
          JOBS=2 \
          tools/toolchain/build.sh

      - name: Compilar biblioteca XSDK
        run: |
          cd xsdk
          make -j2
          rm -rf $HOME/xsdk-gcc-work

      - name: Configurar XFILMEE
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/xsdk/cmake/xsdk.cmake \
            -DXSDK_TOOLCHAIN=$HOME/xsdk-gcc \
            -DCMAKE_BUILD_TYPE=Release

      - name: Gerar XEX
        run: |
          cmake --build build --parallel 2

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: XFILMEE-XBOX360
          path: build/xfilmee.xex
          
